apiVersion: v1
kind: ServiceAccount
metadata:
  name: zeroclaw-ops
  namespace: {{ .Values.global.namespace }}
  labels:
    app: zeroclaw-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zeroclaw-ops-app
  namespace: {{ .Values.rbac.appNamespace }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zeroclaw-ops-app
  namespace: {{ .Values.rbac.appNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zeroclaw-ops-app
subjects:
  - kind: ServiceAccount
    name: zeroclaw-ops
    namespace: {{ .Values.global.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zeroclaw-ops-self
  namespace: {{ .Values.global.namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zeroclaw-ops-self
  namespace: {{ .Values.global.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zeroclaw-ops-self
subjects:
  - kind: ServiceAccount
    name: zeroclaw-ops
    namespace: {{ .Values.global.namespace }}
