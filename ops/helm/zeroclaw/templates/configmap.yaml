apiVersion: v1
kind: ConfigMap
metadata:
  name: zeroclaw-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app: zeroclaw-ops
data:
  config.toml: |
    default_provider = "{{ .Values.config.provider }}"
    default_model = "{{ .Values.config.model }}"
    {{- if .Values.ollama.enabled }}
    api_url = "http://ollama.{{ .Values.global.namespace }}.svc.cluster.local:11434"
    {{- end }}

    [gateway]
    host = "0.0.0.0"
    port = {{ .Values.zeroclaw.gatewayPort }}

    [autonomy]
    level = "supervised"

    [autonomy.shell]
    allowed_commands = ["kubectl", "helm", "curl", "bash", "health-repair.sh"]
    workspace_only = true
  SKILL.md: |
{{ .Files.Get "skills/SKILL.md" | indent 4 }}
  health-repair.sh: |
{{ .Files.Get "files/health-repair.sh" | indent 4 }}
