global:
  namespace: nrdc-poc

backend:
  image:
    repository: nrdc-poc-backend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2

frontend:
  image:
    repository: nrdc-poc-frontend
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2

ingress:
  enabled: true
  className: traefik
  host: nrdc-poc.local
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web

pdb:
  enabled: true
  minAvailable: 1

infrastructure:
  environment: local
  opsNamespace: ops
  zeroclawServiceUrl: http://zeroclaw-ops.ops.svc.cluster.local:42617
