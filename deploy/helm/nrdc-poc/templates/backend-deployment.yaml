apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ include "nrdc-poc.namespace" . }}
  labels:
    app: backend
    {{- include "nrdc-poc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend
      containers:
        - name: api
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: INFRA_ENVIRONMENT
              value: {{ .Values.infrastructure.environment | quote }}
            - name: OPS_NAMESPACE
              value: {{ .Values.infrastructure.opsNamespace | quote }}
            - name: ZEROCLAW_SERVICE_URL
              value: {{ .Values.infrastructure.zeroclawServiceUrl | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
