apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ include "nrdc-poc.namespace" . }}
  labels:
    app: frontend
    {{- include "nrdc-poc.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
