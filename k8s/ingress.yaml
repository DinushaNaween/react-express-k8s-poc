apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nrdc-poc
  namespace: nrdc-poc
  annotations:
    # k3s ships Traefik by default; this works for a single-node POC.
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: nrdc-poc.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
